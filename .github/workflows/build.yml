name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'debug-v*', 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write   # needed to create a Release on a tag

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties') }}

      - name: Unit tests (re-verifies the crypto core)
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Stage APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/passkeychain-${GITHUB_REF_NAME//\//-}-debug.apk"
          ls -l out

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: passkeychain-debug-apk
          path: out/*.apk

      # On a debug-v*/v* tag, publish a Release so the app's self-updater finds it.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ startsWith(github.ref_name, 'debug-') }}
          name: ${{ github.ref_name }}
          files: out/*.apk
          generate_release_notes: true
